services:
  # LocalStack for full AWS service emulation
  localstack:
    image: localstack/localstack:latest
    container_name: shop-api-localstack
    ports:
      - "4566:4566"            # LocalStack Gateway
      - "4510-4559:4510-4559"  # External services port range
    environment:
      - SERVICES=dynamodb,s3,apigateway
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - LAMBDA_EXECUTOR=local
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./localstack-data}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - localstack_net

  # Keep DynamoDB local for compatibility and faster startup
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: shop-api-dynamodb-local
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    volumes:
      - ./dynamodb-data:/home/dynamodblocal/data
    networks:
      - localstack_net

  minio:
    image: minio/minio:latest
    container_name: shop-api-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ./minio-data:/data
    networks:
      - localstack_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

  createbuckets:
    image: minio/mc
    container_name: minio-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - localstack_net
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/lemnispace-services;
      /usr/bin/mc mb --ignore-existing myminio/user-product-files;
      /usr/bin/mc policy set download myminio/lemnispace-services;
      /usr/bin/mc policy set download myminio/user-product-files;
      exit 0;
      "

  create-dynamodb-table:
    image: amazon/aws-cli
    container_name: dynamodb-init
    depends_on:
      - dynamodb-local
    networks:
      - localstack_net
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      aws dynamodb create-table --endpoint-url http://dynamodb-local:8000 --table-name ShopAPI --attribute-definitions AttributeName=PK,AttributeType=S AttributeName=SK,AttributeType=S AttributeName=GSI1PK,AttributeType=S AttributeName=GSI1SK,AttributeType=S AttributeName=GSI2PK,AttributeType=S AttributeName=GSI2SK,AttributeType=S AttributeName=EntityType,AttributeType=S AttributeName=CreatedAt,AttributeType=S --key-schema AttributeName=PK,KeyType=HASH AttributeName=SK,KeyType=RANGE --global-secondary-indexes '[{\"IndexName\":\"GSI1\",\"KeySchema\":[{\"AttributeName\":\"GSI1PK\",\"KeyType\":\"HASH\"},{\"AttributeName\":\"GSI1SK\",\"KeyType\":\"RANGE\"}],\"Projection\":{\"ProjectionType\":\"ALL\"},\"ProvisionedThroughput\":{\"ReadCapacityUnits\":5,\"WriteCapacityUnits\":5}},{\"IndexName\":\"GSI2\",\"KeySchema\":[{\"AttributeName\":\"GSI2PK\",\"KeyType\":\"HASH\"},{\"AttributeName\":\"GSI2SK\",\"KeyType\":\"RANGE\"}],\"Projection\":{\"ProjectionType\":\"ALL\"},\"ProvisionedThroughput\":{\"ReadCapacityUnits\":5,\"WriteCapacityUnits\":5}},{\"IndexName\":\"ProductsByStatus\",\"KeySchema\":[{\"AttributeName\":\"EntityType\",\"KeyType\":\"HASH\"},{\"AttributeName\":\"CreatedAt\",\"KeyType\":\"RANGE\"}],\"Projection\":{\"ProjectionType\":\"ALL\"},\"ProvisionedThroughput\":{\"ReadCapacityUnits\":5,\"WriteCapacityUnits\":5}}]' --provisioned-throughput ReadCapacityUnits=5,WriteCapacityUnits=5 --region us-east-1 || echo 'Table already exists';
      exit 0;
      "

  shop-api:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: shop-api-server
    ports:
      - "8080:8080"
    depends_on:
      - dynamodb-local
      - minio
    environment:
      RUN_LOCAL: "true"
      GIN_MODE: "debug"
      DYNAMODB_TABLE_NAME: "ShopAPI"
      AWS_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
      DYNAMODB_ENDPOINT: "http://dynamodb-local:8000"
      S3_ENDPOINT: "http://minio:9000"
      S3_PUBLIC_ENDPOINT: "http://localhost:9000"  # Public URL for browser access
      S3_REGION: "us-east-1"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
      S3_USE_PATH_STYLE: "true"
      PRINTFUL_API_KEY: "${PRINTFUL_API_KEY:-}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      ADMIN_EMAILS: "admin@lemnispace.local,${ADMIN_EMAILS:-}"
    networks:
      - localstack_net
    volumes:
      - .:/app
    command: go run ./cmd/shop

networks:
  localstack_net:
    driver: bridge
    name: localstack-network

volumes:
  dynamodb-data:
  minio-data: 